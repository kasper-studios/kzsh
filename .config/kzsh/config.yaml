# KASPERENOK ZSH Configuration
bun_default: yes
first_run: yes
auto_start_session: yes  # Auto-start desktop session on TTY1
auto_update: yes  # Auto-update KZSH from GitHub (once per day)

# ============================================
# DISTRIBUTION-SPECIFIC CONFIGURATION
# ============================================

# --- ARCH LINUX PROFILES ---
profile_arch_mandatory: curl git zsh bat lsd ripgrep fzf zoxide unzip neovim fontconfig networkmanager base-devel
profile_arch_core: fastfetch btop tree rsync wget htop nano
profile_arch_dev: nodejs npm docker docker-compose base-devel python python-pip rust go neovim
profile_arch_desktop_gnome: gnome gnome-extra gdm
profile_arch_desktop_kde: plasma-meta kde-applications sddm

# --- ARCH LINUX DESKTOP & TILING WMs ---
profile_arch_desktop_niri: niri sddm kitty tofi swaybg xdg-desktop-portal xdg-desktop-portal-gtk xorg-xwayland qt6-wayland qt5-wayland qt6-declarative pipewire pipewire-pulse pipewire-alsa wireplumber grim slurp wl-clipboard firefox thunar file-roller xdg-user-dirs brightnessctl playerctl
profile_arch_desktop_hyprland: hyprland hyprpaper hyprlock hypridle waybar rofi-wayland kitty sddm xdg-desktop-portal-hyprland polkit-kde-agent qt5-wayland qt6-wayland pipewire wireplumber grim slurp wl-clipboard brightnessctl playerctl thunar
profile_arch_desktop_sway: sway swaylock swayidle swaybg waybar rofi-wayland foot sddm xdg-desktop-portal-wlr polkit-gnome grim slurp wl-clipboard brightnessctl playerctl thunar
profile_arch_desktop_i3: i3-wm i3status i3lock dmenu xterm feh picom lightdm lightdm-gtk-greeter rofi alacritty xorg-xrandr arandr pulseaudio-alsa pavucontrol thunar
profile_arch_desktop_xfce: xfce4 xfce4-goodies lightdm lightdm-gtk-greeter pavucontrol network-manager-applet
profile_arch_desktop_cosmic: cosmic-session cosmic-comp cosmic-applets cosmic-greeter cosmic-edit cosmic-files cosmic-terminal sddm

# --- DEBIAN/UBUNTU PROFILES ---
profile_debian_mandatory: curl git zsh bat lsd ripgrep fzf zoxide unzip neovim fontconfig network-manager build-essential
profile_debian_core: fastfetch btop
profile_debian_dev: nodejs docker.io docker-compose build-essential

# --- GENERIC FALLBACK PROFILES ---
profile_media: chromium firefox vesktop mpv vlc gimp inkscape
profile_extra: steam wine obs-studio
